<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine, Raquel?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url('us.jpg') center / cover no-repeat;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 22px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      max-width: 420px;
      backdrop-filter: blur(6px);
    }

    h1 {
      font-size: 2.3em;
      margin-bottom: 25px;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      font-size: 1.1em;
      padding: 12px 28px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      position: absolute;
    }

    .yes {
      background-color: #ff4d6d;
      color: white;
      left: 50%;
      transform: translateX(-50%);
      bottom: 10px;
    }

    .no {
      background-color: #ffffff;
      color: #ff4d6d;
      left: 10%;
      top: 10px;
      transition: top 0.15s, left 0.15s;
    }
  </style>
</head>
